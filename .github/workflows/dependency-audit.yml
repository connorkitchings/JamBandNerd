name: Dependency Audit

on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    name: Audit Locked Python Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Export locked requirements
        run: |
          uv export \
            --format requirements-txt \
            --locked \
            --no-hashes \
            --no-emit-project \
            --output-file requirements-audit.txt

      - name: Audit locked requirements
        run: |
          uv run --with pip-audit python -m pip_audit \
            -r requirements-audit.txt \
            --cache-dir .cache/pip-audit \
            --no-deps \
            --disable-pip
