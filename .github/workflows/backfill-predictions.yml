name: Sync Retained Prediction Corpus

on:
  workflow_dispatch:
    inputs:
      band:
        description: "Band to backfill"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - billy
          - goose
          - phish
          - um
          - wsp
      dry_run:
        description: "Show what would run without executing"
        required: false
        default: false
        type: boolean

jobs:
  setup:
    name: Setup Matrix
    runs-on: ubuntu-latest
    outputs:
      bands: ${{ steps.set_bands.outputs.bands }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - id: set_bands
        run: |
          if [[ "${{ github.event.inputs.band }}" == "all" ]]; then
            # Eggy excluded from Phase A single-model rollout (see config/models.py ACTIVE_BANDS)
            BANDS_JSON='["goose","phish","wsp","billy","um"]'
            echo "bands=$BANDS_JSON" >> $GITHUB_OUTPUT
          else
            echo "bands=[\"${{ github.event.inputs.band }}\"]" >> $GITHUB_OUTPUT
          fi

  backfill:
    name: Sync retained corpus - ${{ matrix.band }}
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      matrix:
        band: ${{ fromJson(needs.setup.outputs.bands) }}
      fail-fast: false

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate required secrets
        run: |
          if [[ -z "$SUPABASE_URL" ]]; then
            echo "::error::Missing SUPABASE_URL secret"
            exit 1
          fi
          if [[ -z "$SUPABASE_SERVICE_ROLE_KEY" ]]; then
            echo "::error::Missing SUPABASE_SERVICE_ROLE_KEY secret"
            exit 1
          fi
          echo "✅ All required secrets are configured"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --no-dev

      - name: Show retained-corpus dry run
        if: github.event.inputs.dry_run == 'true'
        run: |
          echo "Would sync retained last-50 completed-show corpus for ${{ matrix.band }}"

      - name: Sync retained prediction corpus
        if: github.event.inputs.dry_run != 'true'
        run: |
          echo "::group::Syncing retained last-50 corpus for ${{ matrix.band }}"
          uv run python scripts/sync_retained_prediction_corpus.py --band ${{ matrix.band }} --window 50 --no-incremental
          echo "::endgroup::"

      - name: Validate Prediction Tables
        if: github.event.inputs.dry_run != 'true'
        run: |
          echo "::group::Validating retained accuracy tables for ${{ matrix.band }}"
          uv run python scripts/validate_accuracy_tables.py --band ${{ matrix.band }} --skip-freshness --replay-window 50
          echo "::endgroup::"

  summary:
    name: Backfill Summary
    needs: [setup, backfill]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## Backfill Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Bands: ${{ needs.setup.outputs.bands }}" >> $GITHUB_STEP_SUMMARY
          echo "Dry run: ${{ github.event.inputs.dry_run }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Jobs: ${{ needs.backfill.result == 'success' && 'completed' || 'failed' }}" >> $GITHUB_STEP_SUMMARY
