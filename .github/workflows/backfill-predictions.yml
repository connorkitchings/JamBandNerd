name: Backfill Predictions

on:
  workflow_dispatch:
    inputs:
      band:
        description: "Band to backfill"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - billy
          - eggy
          - goose
          - phish
          - um
          - wsp
      model:
        description: "Model to backfill"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - ckplus
          - notebook
      dry_run:
        description: "Show what would run without executing"
        required: false
        default: false
        type: boolean

jobs:
  setup:
    name: Setup Matrix
    runs-on: ubuntu-latest
    outputs:
      bands: ${{ steps.set_bands.outputs.bands }}
      models: ${{ steps.set_models.outputs.models }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - id: set_bands
        run: |
          if [[ "${{ github.event.inputs.band }}" == "all" ]]; then
            BANDS_JSON=$(python scripts/get_all_bands.py)
            echo "bands=$BANDS_JSON" >> $GITHUB_OUTPUT
          else
            echo "bands=[\"${{ github.event.inputs.band }}\"]" >> $GITHUB_OUTPUT
          fi

      - id: set_models
        run: |
          if [[ "${{ github.event.inputs.model }}" == "all" ]]; then
            echo "models=[\"ckplus\", \"notebook\"]" >> $GITHUB_OUTPUT
          else
            echo "models=[\"${{ github.event.inputs.model }}\"]" >> $GITHUB_OUTPUT
          fi

  backfill:
    name: Backfill - ${{ matrix.band }} / ${{ matrix.model }}
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      matrix:
        band: ${{ fromJson(needs.setup.outputs.bands) }}
        model: ${{ fromJson(needs.setup.outputs.models) }}
      fail-fast: false

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate required secrets
        run: |
          if [[ -z "$SUPABASE_URL" ]]; then
            echo "::error::Missing SUPABASE_URL secret"
            exit 1
          fi
          if [[ -z "$SUPABASE_SERVICE_ROLE_KEY" ]]; then
            echo "::error::Missing SUPABASE_SERVICE_ROLE_KEY secret"
            exit 1
          fi
          echo "✅ All required secrets are configured"

      - name: Set up Python and UV
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          uv venv
          source .venv/bin/activate
          uv pip install -e .

      - name: Get prediction dates
        id: get_dates
        run: |
          source .venv/bin/activate
          echo "::group::Fetching prediction dates for ${{ matrix.band }} / ${{ matrix.model }}"
          DATES_JSON=$(python scripts/get_prediction_dates.py --band ${{ matrix.band }} --model ${{ matrix.model }} --limit 100)
          echo "dates=$DATES_JSON" >> $GITHUB_OUTPUT
          DATE_COUNT=$(echo "$DATES_JSON" | python -c "import json,sys; print(len(json.load(sys.stdin)))")
          echo "date_count=$DATE_COUNT" >> $GITHUB_OUTPUT
          echo "Found $DATE_COUNT dates to backfill"
          echo "::endgroup::"

      - name: Show dates (dry run)
        if: github.event.inputs.dry_run == 'true'
        run: |
          echo "Would regenerate predictions for ${{ matrix.band }} / ${{ matrix.model }}:"
          echo "${{ steps.get_dates.outputs.dates }}"
          echo ""
          echo "Total dates: ${{ steps.get_dates.outputs.date_count }}"

      - name: Regenerate predictions
        if: github.event.inputs.dry_run != 'true'
        run: |
          source .venv/bin/activate
          echo "::group::Backfilling ${{ steps.get_dates.outputs.date_count }} dates for ${{ matrix.band }} / ${{ matrix.model }}"

          DATES='${{ steps.get_dates.outputs.dates }}'
          for DATE in $(echo "$DATES" | python -c "import json,sys; print(' '.join(json.load(sys.stdin)))"); do
            echo "Regenerating prediction for ${{ matrix.band }} / ${{ matrix.model }} on $DATE"
            python scripts/generate_predictions.py --band ${{ matrix.band }} --model ${{ matrix.model }} --date "$DATE"
            echo "Verifying recent_avg_gap for $DATE:"
            python scripts/check_recent_avg_gap.py --band ${{ matrix.band }} --model ${{ matrix.model }} --date "$DATE"
            echo "Python path debug:"
            python -c "import src.jambandnerd.transformations.gaps as g; import inspect; src=inspect.getsource(g._stats_for_song); print('recent_avg_gap' in src)"
          done

          echo "::endgroup::"

      - name: Validate Prediction Tables
        if: github.event.inputs.dry_run != 'true'
        run: |
          source .venv/bin/activate
          echo "::group::Validating prediction tables for ${{ matrix.band }} / ${{ matrix.model }}"
          python scripts/validate_prediction_tables.py --band ${{ matrix.band }} --max-age-hours 168
          echo "::endgroup::"

  summary:
    name: Backfill Summary
    needs: [setup, backfill]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## Backfill Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Bands: ${{ needs.setup.outputs.bands }}" >> $GITHUB_STEP_SUMMARY
          echo "Models: ${{ needs.setup.outputs.models }}" >> $GITHUB_STEP_SUMMARY
          echo "Dry run: ${{ github.event.inputs.dry_run }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Jobs: ${{ needs.setup.result == 'success' && 'completed' || 'failed' }}" >> $GITHUB_STEP_SUMMARY
