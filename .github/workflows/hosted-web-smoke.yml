name: Hosted Website Smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Hosted website URL to verify"
        required: false
        default: "https://jambandnerd.com"
        type: string
  schedule:
    - cron: "0 22 * * *"

permissions:
  contents: read

jobs:
  verify-hosted-web:
    name: Verify Hosted Website
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SMOKE_BASE_URL: ${{ github.event.inputs.base_url || 'https://jambandnerd.com' }}
      VERCEL_PROTECTION_BYPASS_TOKEN: ${{ secrets.VERCEL_PROTECTION_BYPASS_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright OS Dependencies
        run: npx playwright install-deps chromium

      - name: Cache Playwright Browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Validate preview bypass configuration
        run: |
          if [[ "$SMOKE_BASE_URL" == https://*.vercel.app* ]] && [[ -z "$VERCEL_PROTECTION_BYPASS_TOKEN" ]]; then
            echo "::error::Preview hosted smoke requires the VERCEL_PROTECTION_BYPASS_TOKEN GitHub secret."
            exit 1
          fi

      - name: Run hosted website smoke tests
        run: npm run test:web:smoke:hosted
