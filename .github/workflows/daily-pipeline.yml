name: Daily Data Pipeline

on:
  schedule:
    - cron: '0 19 * * *' # Runs daily at 19:00 UTC (3 PM ET during DST, 2 PM ET otherwise)
  workflow_dispatch:
    inputs:
      band:
        description: 'Run pipeline for a specific band (or all)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - billy
          - eggy
          - goose
          - phish
          - um
          - wsp
      skip_accuracy:
        description: 'Skip accuracy calculation to run pipeline faster'
        required: false
        default: false
        type: boolean

jobs:
  setup:
    name: Setup Dynamic Matrix
    runs-on: ubuntu-latest
    outputs:
      bands: ${{ steps.get_bands.outputs.bands }}
      bands_list: ${{ steps.get_bands.outputs.bands_list }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: get_bands
        run: |
          BANDS_JSON=$(python scripts/get_all_bands.py)
          echo "bands=$BANDS_JSON" >> $GITHUB_OUTPUT
          echo "bands_list=$BANDS_JSON" >> $GITHUB_OUTPUT

  daily-pipeline:
    name: Daily Pipeline - ${{ matrix.band }}
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      matrix:
        band: ${{ fromJson(needs.setup.outputs.bands) }}
      fail-fast: false

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      PHISH_API_KEY: ${{ secrets.PHISH_API_KEY }}

    outputs:
      band_status: ${{ steps.set_status.outputs.status }}

    steps:
      - name: Check if job should run
        id: check
        run: |
          BAND_INPUT="${{ github.event.inputs.band || 'all' }}"
          if [[ "${{ github.event_name }}" == "schedule" || "$BAND_INPUT" == "all" || "$BAND_INPUT" == "${{ matrix.band }}" ]]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repository
        if: steps.check.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Validate required secrets
        if: steps.check.outputs.should_run == 'true'
        run: |
          MISSING=()
          
          # Check each secret by testing if it's empty
          if [[ -z "$SUPABASE_URL" ]]; then
            MISSING+=("SUPABASE_URL")
          fi
          
          if [[ -z "$SUPABASE_KEY" ]]; then
            MISSING+=("SUPABASE_KEY")
          fi
          
          if [[ -z "$PHISH_API_KEY" ]]; then
            MISSING+=("PHISH_API_KEY")
          fi
          
          if [[ ${#MISSING[@]} -gt 0 ]]; then
            echo "::error::Missing required secrets: ${MISSING[*]}"
            exit 1
          fi
          
          echo "✅ All required secrets are configured"

      - name: Set up Python and UV
        if: steps.check.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install Dependencies
        if: steps.check.outputs.should_run == 'true'
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          uv venv
          source .venv/bin/activate
          uv pip install .

      - name: Install Playwright Browsers
        if: steps.check.outputs.should_run == 'true'
        run: |
          source .venv/bin/activate
          playwright install --with-deps firefox

      - name: Run Data Collection
        if: steps.check.outputs.should_run == 'true'
        run: |
          source .venv/bin/activate
          echo "::group::Collecting data for ${{ matrix.band }}"
          
          # Verify collection script exists
          SCRIPT_PATH="scripts/run_${{ matrix.band }}_collection.py"
          if [[ ! -f "$SCRIPT_PATH" ]]; then
            echo "::error::Collection script not found: $SCRIPT_PATH"
            exit 1
          fi
          
          # Use retry logic for all bands for consistency
          MAX_RETRIES=3
          RETRY_COUNT=0
          RETRY_DELAY=30
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            echo "Attempt $((RETRY_COUNT + 1)) of $MAX_RETRIES for ${{ matrix.band }} collection"
            
            if python "$SCRIPT_PATH"; then
              echo "✅ Collection for ${{ matrix.band }} successful"
              break
            else
              RETRY_COUNT=$((RETRY_COUNT + 1))
              if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                echo "⚠️ Collection for ${{ matrix.band }} failed, retrying in ${RETRY_DELAY} seconds..."
                sleep $RETRY_DELAY
              else
                echo "::error::Collection for ${{ matrix.band }} failed after $MAX_RETRIES attempts"
                exit 1
              fi
            fi
          done
          
          echo "::endgroup::"

      - name: Verify Data Freshness
        if: steps.check.outputs.should_run == 'true'
        id: data_check
        env:
          BAND: ${{ matrix.band }}
        run: |
          source .venv/bin/activate
          echo "::group::Verifying data freshness for ${{ matrix.band }}"
          
          python scripts/verify_data_freshness.py
          
          echo "::endgroup::"
          
      - name: Alert on Data Issues
        if: steps.data_check.outputs.missing_data == 'true'
        env:
          MISSING_COUNT: ${{ steps.data_check.outputs.missing_count }}
        run: |
          COUNT=${MISSING_COUNT:-0}
          echo "::error::Critical: ${COUNT} recent ${{ matrix.band }} shows are missing setlist data!"
          echo "This may cause predictions to include songs that were recently played."
          echo "Consider running the collection script manually to fetch missing setlists."
          
      - name: Generate Predictions (Notebook & CK+)
        if: steps.check.outputs.should_run == 'true'
        run: |
          source .venv/bin/activate
          echo "::group::Generating predictions for ${{ matrix.band }}"
          
          # Generate for the next upcoming show (default behavior)
          python scripts/generate_predictions.py --band ${{ matrix.band }} --model notebook
          python scripts/generate_predictions.py --band ${{ matrix.band }} --model ckplus
          
          # Also generate for the most recent completed show to power setlist highlighting
          echo "Finding last completed show date..."
          LAST_COMPLETED_DATE=$(python scripts/get_last_completed_show_date.py --band ${{ matrix.band }})
          
          if [[ -n "$LAST_COMPLETED_DATE" ]]; then
            echo "Last completed show date is $LAST_COMPLETED_DATE. Generating predictions for this date."
            python scripts/generate_predictions.py --band ${{ matrix.band }} --model notebook --date $LAST_COMPLETED_DATE
            python scripts/generate_predictions.py --band ${{ matrix.band }} --model ckplus --date $LAST_COMPLETED_DATE
          else
            echo "Could not determine last completed show date. Skipping predictions for it."
          fi
          
          echo "::endgroup::"

      - name: Run Backtest and Calculate Aggregate Accuracy
        if: steps.check.outputs.should_run == 'true' && (github.event.inputs.skip_accuracy != 'true')
        run: |
          source .venv/bin/activate
          echo "::group::Running backtest for ${{ matrix.band }}"
          
          # Run backtest for last 100 shows to populate per-show accuracy
          python scripts/run_backtest.py --band ${{ matrix.band }} --model notebook --shows 100
          python scripts/run_backtest.py --band ${{ matrix.band }} --model ckplus --shows 100
          
          echo "::endgroup::"
          
          echo "::group::Calculating aggregate accuracy for ${{ matrix.band }}"
          
          # Calculate aggregate accuracy from the per-show data
          python scripts/save_aggregate_accuracy.py --band ${{ matrix.band }} --model notebook --shows 100
          python scripts/save_aggregate_accuracy.py --band ${{ matrix.band }} --model ckplus --shows 100
          
          echo "::endgroup::"

      - name: Set Job Status Output
        id: set_status
        if: always()
        run: |
          echo "status=${{ job.status }}" >> $GITHUB_OUTPUT

  pipeline-summary:
    name: Pipeline Summary
    needs: [setup, daily-pipeline]
    if: always()
    runs-on: ubuntu-latest
    
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      BAND_LIST_JSON: ${{ needs.setup.outputs.bands_list }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install minimal dependencies
        run: |
          pip install pandas supabase python-dotenv
          
      - name: Generate pipeline summary header
        run: |
          echo "## Daily Pipeline Summary - $(date)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ needs.daily-pipeline.result }}" == "success" ]]; then
            echo "✅ **All band pipelines completed successfully!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **One or more band pipelines failed, were skipped, or were cancelled.**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Please check the logs for the 'daily-pipeline' job matrix for details." >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Data Quality Check" >> $GITHUB_STEP_SUMMARY
          
      - name: Run data quality check
        run: |
          python -c "
          import json
          import os 
          import sys 
          import pandas as pd
          from datetime import date, timedelta
          
          repo_root = os.environ.get('GITHUB_WORKSPACE', '.')
          sys.path.insert(0, os.path.join(repo_root, 'src'))
          
          from jambandnerd.db.connection import get_supabase_client
          from jambandnerd.config import BAND_ID_COLUMNS
          
          client = get_supabase_client()
          cutoff = (date.today() - timedelta(days=7)).isoformat()
          bands = json.loads(os.environ['BAND_LIST_JSON'])
          
          for band in bands:
              try:
                  id_col = BAND_ID_COLUMNS.get(band, 'show_id')
                  shows_data = client.table(f'{band}_shows_raw').select('*').gte('show_date', cutoff).execute().data
                  setlists_data = client.table(f'{band}_setlists_raw').select(id_col).execute().data
                  
                  shows = pd.DataFrame(shows_data) if shows_data else pd.DataFrame()
                  setlists = pd.DataFrame(setlists_data) if setlists_data else pd.DataFrame()
                  
                  if not shows.empty:
                      show_ids = set(shows[id_col].astype(str))
                      setlist_ids = set(setlists[id_col].astype(str)) if not setlists.empty else set()
                      missing = show_ids - setlist_ids
                      
                      print(f'**{band.upper()}**:')
                      if missing:
                          print(f'  - ⚠️ {len(missing)} recent shows missing setlist data')
                      else:
                          print(f'  - ✅ All recent shows have setlist data')
                      print(f'  - Total recent shows: {len(show_ids)}')
                      print()
                  else:
                      print(f'**{band.upper()}**: ℹ️ No recent shows in last 7 days')
                      print()
              except Exception as e:
                  print(f'**{band.upper()}**: ❌ Error checking data: {str(e)}')
                  print()
          " >> $GITHUB_STEP_SUMMARY
          
      - name: Generate prediction coverage header
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Prediction Coverage" >> $GITHUB_STEP_SUMMARY
          
      - name: Run prediction coverage check
        run: |
          python -c "
          import json, os, sys
          from datetime import date
          
          repo_root = os.environ.get('GITHUB_WORKSPACE', '.')
          sys.path.insert(0, os.path.join(repo_root, 'src'))
          
          from jambandnerd.config import BAND_ID_COLUMNS
          from jambandnerd.db.connection import get_supabase_client
          
          client = get_supabase_client()
          today = date.today().isoformat()
          bands = json.loads(os.environ['BAND_LIST_JSON'])
          
          print('| Band | Notebook Top-50 Hits | Songs Played | Reference Date |')
          print('| --- | --- | --- | --- |')
          
          for band in bands:
              id_col = BAND_ID_COLUMNS.get(band, 'show_id')
              try:
                  shows_resp = client.table(f'{band}_shows_raw').select(f'{id_col}, show_date').lte('show_date', today).order('show_date', desc=True).limit(50).execute()
                  
                  latest_show = None
                  for row in shows_resp.data or []:
                      show_id = row.get(id_col)
                      if show_id is None:
                          continue
                      setlist_check = client.table(f'{band}_setlists_raw').select(id_col).eq(id_col, str(show_id)).limit(1).execute()
                      if setlist_check.data:
                          latest_show = row
                          break
                  
                  if not latest_show:
                      print(f'| {band.upper()} | n/a | n/a | No completed shows |')
                      continue
                  
                  show_id_value = str(latest_show.get(id_col))
                  ref_date = latest_show.get('show_date', 'n/a')
                  
                  setlist_resp = client.table(f'{band}_setlists_raw').select('song_name').eq(id_col, show_id_value).execute()
                  actual_songs = {str(row.get('song_name')) for row in (setlist_resp.data or []) if row.get('song_name')}
                  
                  pred_resp = client.table('predictions_notebook').select('predictions').eq('band', band).eq('reference_date', ref_date).order('predicted_at', desc=True).limit(1).execute()
                  
                  if not pred_resp.data:
                      print(f'| {band.upper()} | No predictions | {len(actual_songs)} | {ref_date} |')
                      continue
                  
                  predictions_payload = pred_resp.data[0].get('predictions')
                  if isinstance(predictions_payload, str):
                      predictions = json.loads(predictions_payload)
                  else:
                      predictions = predictions_payload or []
                  
                  top_hits = sum(1 for entry in predictions[:50] if entry.get('song_name') in actual_songs)
                  print(f'| {band.upper()} | {top_hits}/{len(actual_songs)} | {len(actual_songs)} | {ref_date} |')
              except Exception as exc:
                  print(f'| {band.upper()} | Error | n/a | n/a |')
          " >> $GITHUB_STEP_SUMMARY
          
      - name: Add next steps
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps:" >> $GITHUB_STEP_SUMMARY
                    echo "- Visit the [JamBandNerd web app](https://jambandnerd.streamlit.app/) to view updated predictions." >> $GITHUB_STEP_SUMMARY
                    echo "- Check the Supabase dashboard for data validation." >> $GITHUB_STEP_SUMMARY
                              echo "- Review any warnings above and re-run collection if needed." >> $GITHUB_STEP_SUMMARY
          
            notify-discord:
              name: Notify Discord
              needs: [daily-pipeline]
              runs-on: ubuntu-latest
              if: always() && github.event_name == 'schedule' # Only notify on scheduled runs
          
              steps:
                - name: Send Discord Notification
                  env:
                    DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
                    PIPELINE_STATUS: ${{ needs.daily-pipeline.result }}
                  run: |
                    if [[ -z "$DISCORD_WEBHOOK_URL" ]]; then
                      echo "::warning::DISCORD_WEBHOOK_URL secret not set. Skipping notification."
                      exit 0
                    fi
          
                    if [[ "$PIPELINE_STATUS" == "success" ]]; then
                      STATUS_MESSAGE="✅ Success"
                      COLOR=3066993 # Green
                    elif [[ "$PIPELINE_STATUS" == "failure" ]]; then
                      STATUS_MESSAGE="❌ Failure"
                      COLOR=15158332 # Red
                    else
                      STATUS_MESSAGE="⚠️ Canceled or Skipped"
                      COLOR=16776960 # Yellow
                    fi
          
                    REPO_URL="${{ github.server_url }}/${{ github.repository }}"
                    RUN_URL="$REPO_URL/actions/runs/${{ github.run_id }}"
                    
                    # Construct the JSON payload
                    PAYLOAD=$(cat <<EOF
                    {
                      "embeds": [{
                        "title": "JamBandNerd Daily Pipeline",
                        "description": "The daily data pipeline has finished running.",
                        "url": "$RUN_URL",
                        "color": $COLOR,
                        "fields": [
                          {
                            "name": "Status",
                            "value": "$STATUS_MESSAGE",
                            "inline": true
                          },
                          {
                            "name": "Trigger",
                            "value": "${{ github.event_name }}",
                            "inline": true
                          }
                        ],
                        "footer": {
                          "text": "Repository: ${{ github.repository }}"
                        },
                        "timestamp": "$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')"
                      }]
                    }
                    EOF
                    )
          
                    curl -X POST -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"
          