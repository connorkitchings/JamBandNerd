name: Daily Data Pipeline

on:
  schedule:
    - cron: '0 19 * * *' # Runs daily at 19:00 UTC (3:00 PM ET during DST)
  workflow_dispatch:

jobs:
  run-daily-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      PHISH_API_KEY: ${{ secrets.PHISH_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python and install dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          uv venv
          source .venv/bin/activate
          uv pip install .
        shell: bash

      - name: Run daily pipeline
        run: |
          source .venv/bin/activate
          # --- Goose Pipeline ---
          echo "Running Goose data collection..."
          python scripts/run_goose_collection.py --skip-validation
          echo "Generating Goose Notebook predictions..."
          python scripts/generate_goose_predictions.py
          echo "Saving Goose Notebook accuracy..."
          python scripts/save_notebook_accuracy.py --band goose --shows 50
          echo "Generating Goose CK+ predictions..."
          python scripts/generate_goose_ckplus_predictions.py
          echo "Saving Goose CK+ accuracy..."
          python scripts/save_ckplus_accuracy.py --band goose --shows 50

          # --- Phish Pipeline ---
          echo "Running Phish data collection..."
          python scripts/run_phish_collection.py --skip-validation
          echo "Generating Phish Notebook predictions..."
          python scripts/generate_phish_predictions.py
          echo "Saving Phish Notebook accuracy..."
          python scripts/save_notebook_accuracy.py --band phish --shows 50
          echo "Generating Phish CK+ predictions..."
          python scripts/generate_phish_ckplus_predictions.py
          echo "Saving Phish CK+ accuracy..."
          python scripts/save_ckplus_accuracy.py --band phish --shows 50
        shell: bash