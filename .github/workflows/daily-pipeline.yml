name: Daily Data Pipeline

on:
  schedule:
    - cron: '0 19 * * *' # Runs daily at 19:00 UTC (3 PM ET during DST, 2 PM ET otherwise)
  workflow_dispatch:
    inputs:
      band:
        description: 'Run pipeline for a specific band (or all)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - billy
          - eggy
          - goose
          - phish
          - um
          - wsp
      skip_accuracy:
        description: 'Skip accuracy calculation to run pipeline faster'
        required: false
        default: false
        type: boolean

jobs:
  setup:
    name: Setup Dynamic Matrix
    runs-on: ubuntu-latest
    outputs:
      bands: ${{ steps.get_bands.outputs.bands }}
      bands_list: ${{ steps.get_bands.outputs.bands_list }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - id: get_bands
        run: |
          BANDS_JSON=$(python scripts/get_all_bands.py)
          echo "bands=$BANDS_JSON" >> $GITHUB_OUTPUT
          echo "bands_list=$BANDS_JSON" >> $GITHUB_OUTPUT

  daily-pipeline:
    name: Daily Pipeline - ${{ matrix.band }}
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      matrix:
        band: ${{ fromJson(needs.setup.outputs.bands) }}
      fail-fast: false

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PHISH_API_KEY: ${{ secrets.PHISH_API_KEY }}

    outputs:
      band_status: ${{ steps.set_status.outputs.status }}

    steps:
      - name: Check if job should run
        id: check
        run: |
          BAND_INPUT="${{ github.event.inputs.band || 'all' }}"
          if [[ "${{ github.event_name }}" == "schedule" || "$BAND_INPUT" == "all" || "$BAND_INPUT" == "${{ matrix.band }}" ]]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repository
        if: steps.check.outputs.should_run == 'true'
        uses: actions/checkout@v6

      - name: Validate required secrets
        if: steps.check.outputs.should_run == 'true'
        run: |
          MISSING=()
          BAND="${{ matrix.band }}"
          
          # Check each secret by testing if it's empty
          if [[ -z "$SUPABASE_URL" ]]; then
            MISSING+=("SUPABASE_URL")
          fi
          
          if [[ -z "$SUPABASE_SERVICE_ROLE_KEY" ]]; then
            MISSING+=("SUPABASE_SERVICE_ROLE_KEY")
          fi
          
          # PHISH_API_KEY is only required for Phish collection
          if [[ "$BAND" == "phish" && -z "$PHISH_API_KEY" ]]; then
            MISSING+=("PHISH_API_KEY (required for phish only)")
          fi
          
          if [[ ${#MISSING[@]} -gt 0 ]]; then
            echo "::error::Missing required secrets: ${MISSING[*]}"
            exit 1
          fi
          
          echo "✅ All required secrets are configured"

      - name: Set up Python and UV
        if: steps.check.outputs.should_run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      
      - name: Install Dependencies
        if: steps.check.outputs.should_run == 'true'
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          uv venv
          source .venv/bin/activate
          uv pip install .

      - name: Install Playwright Browsers
        if: steps.check.outputs.should_run == 'true' && matrix.band == 'wsp'
        run: |
          source .venv/bin/activate
          playwright install --with-deps firefox

      - name: Run Data Collection
        if: steps.check.outputs.should_run == 'true'
        run: |
          source .venv/bin/activate
          echo "::group::Collecting data for ${{ matrix.band }}"
          
          # Verify collection script exists
          SCRIPT_PATH="scripts/run_${{ matrix.band }}_collection.py"
          if [[ ! -f "$SCRIPT_PATH" ]]; then
            echo "::error::Collection script not found: $SCRIPT_PATH"
            exit 1
          fi
          
          # Use retry logic for all bands for consistency
          MAX_RETRIES=3
          RETRY_COUNT=0
          RETRY_DELAY=30
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            echo "Attempt $((RETRY_COUNT + 1)) of $MAX_RETRIES for ${{ matrix.band }} collection"
            
            if python "$SCRIPT_PATH"; then
              echo "✅ Collection for ${{ matrix.band }} successful"
              break
            else
              RETRY_COUNT=$((RETRY_COUNT + 1))
              if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                echo "⚠️ Collection for ${{ matrix.band }} failed, retrying in ${RETRY_DELAY} seconds..."
                sleep $RETRY_DELAY
              else
                echo "::error::Collection for ${{ matrix.band }} failed after $MAX_RETRIES attempts"
                exit 1
              fi
            fi
          done
          
          echo "::endgroup::"

      - name: Verify Data Freshness
        if: steps.check.outputs.should_run == 'true'
        id: data_check
        env:
          BAND: ${{ matrix.band }}
        run: |
          source .venv/bin/activate
          echo "::group::Verifying data freshness for ${{ matrix.band }}"
          
          python scripts/verify_data_freshness.py
          
          echo "::endgroup::"
          
      - name: Alert on Data Issues
        if: steps.data_check.outputs.missing_data == 'true'
        env:
          MISSING_COUNT: ${{ steps.data_check.outputs.missing_count }}
        run: |
          COUNT=${MISSING_COUNT:-0}
          echo "::error::Critical: ${COUNT} recent ${{ matrix.band }} shows are missing setlist data!"
          echo "This may cause predictions to include songs that were recently played."
          echo "Consider running the collection script manually to fetch missing setlists."
          
      - name: Generate Predictions (Notebook & CK+)
        if: steps.check.outputs.should_run == 'true'
        run: |
          source .venv/bin/activate
          echo "::group::Generating predictions for ${{ matrix.band }}"
          
          # Generate for the next upcoming show (default behavior)
          python scripts/generate_predictions.py --band ${{ matrix.band }} --model notebook
          python scripts/generate_predictions.py --band ${{ matrix.band }} --model ckplus
          
          # Also generate for the most recent completed show to power setlist highlighting
          echo "Finding last completed show date..."
          LAST_COMPLETED_DATE=$(python scripts/get_last_completed_show_date.py --band ${{ matrix.band }})
          
          if [[ -n "$LAST_COMPLETED_DATE" ]]; then
            echo "Last completed show date is $LAST_COMPLETED_DATE. Generating predictions for this date."
            python scripts/generate_predictions.py --band ${{ matrix.band }} --model notebook --date $LAST_COMPLETED_DATE
            python scripts/generate_predictions.py --band ${{ matrix.band }} --model ckplus --date $LAST_COMPLETED_DATE
          else
            echo "Could not determine last completed show date. Skipping predictions for it."
          fi
          
          echo "::endgroup::"

      - name: Validate Prediction Tables
        if: steps.check.outputs.should_run == 'true'
        run: |
          source .venv/bin/activate
          echo "::group::Validating prediction table freshness for ${{ matrix.band }}"
          python scripts/validate_prediction_tables.py --band ${{ matrix.band }} --max-age-hours 72
          echo "::endgroup::"

      - name: Run Backtest and Calculate Aggregate Accuracy
        if: steps.check.outputs.should_run == 'true' && (github.event.inputs.skip_accuracy != 'true')
        run: |
          source .venv/bin/activate
          echo "::group::Running backtest for ${{ matrix.band }}"
          
          # Run backtest for last 100 shows to populate per-show accuracy
          python scripts/run_backtest.py --band ${{ matrix.band }} --model notebook --shows 100
          python scripts/run_backtest.py --band ${{ matrix.band }} --model ckplus --shows 100
          
          echo "::endgroup::"
          
          echo "::group::Calculating aggregate accuracy for ${{ matrix.band }}"
          
          # Calculate aggregate accuracy from the per-show data
          python scripts/save_aggregate_accuracy.py --band ${{ matrix.band }} --model notebook --shows 100
          python scripts/save_aggregate_accuracy.py --band ${{ matrix.band }} --model ckplus --shows 100
          
          echo "::endgroup::"

      - name: Validate Accuracy Tables
        if: steps.check.outputs.should_run == 'true' && (github.event.inputs.skip_accuracy != 'true')
        run: |
          source .venv/bin/activate
          echo "::group::Validating accuracy tables for ${{ matrix.band }}"
          python scripts/validate_accuracy_tables.py --band ${{ matrix.band }} --max-age-hours 72
          echo "::endgroup::"

      - name: Set Job Status Output
        id: set_status
        if: always()
        run: |
          echo "status=${{ job.status }}" >> $GITHUB_OUTPUT

  pipeline-summary:
    name: Pipeline Summary
    needs: [setup, daily-pipeline]
    if: always()
    runs-on: ubuntu-latest
    
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      BAND_LIST_JSON: ${{ needs.setup.outputs.bands_list }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          
      - name: Install minimal dependencies
        run: |
          pip install pandas supabase python-dotenv
          
      - name: Generate pipeline summary header
        run: |
          echo "## Daily Pipeline Summary - $(date)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ needs.daily-pipeline.result }}" == "success" ]]; then
            echo "✅ **All band pipelines completed successfully!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **One or more band pipelines failed, were skipped, or were cancelled.**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Please check the logs for the 'daily-pipeline' job matrix for details." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Generate monitoring summary
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          python scripts/generate_pipeline_summary.py --bands-json "$BAND_LIST_JSON" >> $GITHUB_STEP_SUMMARY
          
      - name: Add next steps
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps:" >> $GITHUB_STEP_SUMMARY
          echo "- Open the JamBandNerd website deployment to review updated predictions." >> $GITHUB_STEP_SUMMARY
          echo "- Check the Supabase dashboard for data validation." >> $GITHUB_STEP_SUMMARY
          echo "- Review any warnings above and re-run collection if needed." >> $GITHUB_STEP_SUMMARY

  notify-discord:
    name: Notify Discord
    needs: [daily-pipeline, pipeline-summary]
    if: failure()
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - name: Post status to Discord
        if: env.DISCORD_WEBHOOK_URL != ''
        env:
          WORKFLOW_STATUS: ${{ needs.daily-pipeline.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          STATUS_TEXT="⚠️ Daily pipeline completed with issues (check GitHub Actions)"

          payload=$(STATUS_TEXT="$STATUS_TEXT" python - <<'PY'
          import json, os
          content = f"{os.environ['STATUS_TEXT']}\n{os.environ['RUN_URL']}"
          print(json.dumps({"content": content}))
          PY
          )

          curl -sS -X POST -H "Content-Type: application/json" -d "$payload" "$DISCORD_WEBHOOK_URL"
          
