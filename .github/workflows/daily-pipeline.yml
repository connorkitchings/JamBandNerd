name: Daily JamBandNerd Pipeline

on:
  schedule:
    # Run daily at 3 PM Eastern (19:00 UTC in standard time, 20:00 UTC in daylight time)
    # Using 20:00 UTC to account for daylight saving time
    - cron: '0 20 * * *'
  workflow_dispatch:  # Allow manual triggering

env:
  PYTHON_VERSION: '3.10'

jobs:
  run-data-collection:
    name: Data Collection Pipeline
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      PHISH_API_KEY: ${{ secrets.PHISH_API_KEY }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        
    - name: Debug Secrets
      run: |
        if [ -z "$SUPABASE_URL" ]; then
          echo "SUPABASE_URL is not set"
        else
          echo "SUPABASE_URL is set"
        fi
        if [ -z "$SUPABASE_KEY" ]; then
          echo "SUPABASE_KEY is not set"
        else
          echo "SUPABASE_KEY is set"
        fi
        if [ -z "$PHISH_API_KEY" ]; then
          echo "PHISH_API_KEY is not set"
        else
          echo "PHISH_API_KEY is set"
        fi

    - name: Run WSP Data Collection
      run: |
        python3 -m jambandnerd.data_collection.wsp.run_pipeline_supabase
        
    - name: Upload collection logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: collection-logs
        path: logs/
        retention-days: 7

  run-predictions:
    name: Prediction Pipeline
    runs-on: ubuntu-latest
    needs: run-data-collection  # Wait for data collection to complete

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      PHISH_API_KEY: ${{ secrets.PHISH_API_KEY }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        
    - name: Debug Secrets
      run: |
        if [ -z "$SUPABASE_URL" ]; then
          echo "SUPABASE_URL is not set"
        else
          echo "SUPABASE_URL is set"
        fi
        if [ -z "$SUPABASE_KEY" ]; then
          echo "SUPABASE_KEY is not set"
        else
          echo "SUPABASE_KEY is set"
        fi
        if [ -z "$PHISH_API_KEY" ]; then
          echo "PHISH_API_KEY is not set"
        else
          echo "PHISH_API_KEY is set"
        fi

    - name: Run All Prediction Pipelines
      run: |
        python3 -m jambandnerd.predictions.run_all_predictions
        
    - name: Upload prediction logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: prediction-logs
        path: logs/
        retention-days: 7

  notify-completion:
    name: Notify Pipeline Completion
    runs-on: ubuntu-latest
    needs: [run-data-collection, run-predictions]
    if: always()
    
    steps:
    - name: Report Status
      run: |
        echo "Data Collection Status: ${{ needs.run-data-collection.result }}"
        echo "Predictions Status: ${{ needs.run-predictions.result }}"
        if [[ "${{ needs.run-data-collection.result }}" == "success" && "${{ needs.run-predictions.result }}" == "success" ]]; then
          echo "✅ All pipelines completed successfully!"
        else
          echo "❌ One or more pipelines failed"
          exit 1
        fi
