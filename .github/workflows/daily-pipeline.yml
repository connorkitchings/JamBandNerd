name: Daily Data Pipeline

on:
  schedule:
    - cron: '0 19 * * *' # Runs daily at 19:00 UTC (3:00 PM ET during DST)
  workflow_dispatch:
    inputs:
      band:
        description: 'Run pipeline for a specific band (or all)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - goose
          - phish
          - wsp
      skip_accuracy:
        description: 'Skip accuracy calculation to run pipeline faster'
        required: false
        default: false
        type: boolean

jobs:
  daily-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      matrix:
        # Run a separate job for each band to isolate failures
        band: [goose, phish, wsp]
      fail-fast: false

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      PHISH_API_KEY: ${{ secrets.PHISH_API_KEY }}

    steps:
      - name: Check if job should run
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "schedule" || "${{ inputs.band }}" == "all" || "${{ inputs.band }}" == "${{ matrix.band }}" ]]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repository
        if: steps.check.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python and UV
        if: steps.check.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install Dependencies
        if: steps.check.outputs.should_run == 'true'
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          uv venv
          source .venv/bin/activate
          uv pip install .

      - name: Run Data Collection
        if: steps.check.outputs.should_run == 'true'
        run: |
          source .venv/bin/activate
          echo "::group::Collecting data for ${{ matrix.band }}"
          # Note: These collection scripts contain their own logic for fetching recent data
          python scripts/run_${{ matrix.band }}_collection.py
          echo "::endgroup::"

      - name: Generate Predictions (Notebook & CK+)
        if: steps.check.outputs.should_run == 'true'
        run: |
          source .venv/bin/activate
          echo "::group::Generating predictions for ${{ matrix.band }}"
          python scripts/generate_predictions.py --band ${{ matrix.band }} --model notebook
          python scripts/generate_predictions.py --band ${{ matrix.band }} --model ckplus
          echo "::endgroup::"

      - name: Run Backtest and Calculate Aggregate Accuracy
        if: steps.check.outputs.should_run == 'true' && !inputs.skip_accuracy
        run: |
          source .venv/bin/activate
          echo "::group::Running backtest for ${{ matrix.band }}"
          # Run backtest for last 100 shows to populate per-show accuracy
          python scripts/run_backtest.py --band ${{ matrix.band }} --model notebook --shows 100
          python scripts/run_backtest.py --band ${{ matrix.band }} --model ckplus --shows 100
          echo "::endgroup::"
          
          echo "::group::Calculating aggregate accuracy for ${{ matrix.band }}"
          # Calculate aggregate accuracy from the per-show data
          python scripts/save_aggregate_accuracy.py --band ${{ matrix.band }} --model notebook --shows 100
          python scripts/save_aggregate_accuracy.py --band ${{ matrix.band }} --model ckplus --shows 100
          echo "::endgroup::"

  pipeline-summary:
    name: Pipeline Summary
    needs: [daily-pipeline]
    if: always() # This job runs even if the matrix jobs fail
    runs-on: ubuntu-latest
    steps:
      - name: Generate pipeline summary
        run: |
          echo "## Daily Pipeline Summary - $(date)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Check the overall result of the matrix job
          # Note: 'needs.daily-pipeline.result' will be 'success' only if all matrix jobs succeed.
          # It will be 'failure' if at least one fails.
          if [[ "${{ needs.daily-pipeline.result }}" == "success" ]]; then
            echo "✅ **All band pipelines completed successfully!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **One or more band pipelines failed, were skipped, or were cancelled.**" >> $GITHUB_STEP_SUMMARY
            echo "Please check the logs for the 'daily-pipeline' job matrix for details." >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps:" >> $GITHUB_STEP_SUMMARY
          echo "- Visit the [JamBandNerd web app](https://jambandnerd.streamlit.app/) to view updated predictions." >> $GITHUB_STEP_SUMMARY
          echo "- Check the Supabase dashboard for data validation." >> $GITHUB_STEP_SUMMARY