name: Daily Data Pipeline

on:
  schedule:
    - cron: '0 19 * * *' # Runs daily at 19:00 UTC (3 PM ET during DST, 2 PM ET otherwise)
  workflow_dispatch:
    inputs:
      band:
        description: 'Run pipeline for a specific band (or all)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - billy
          - eggy
          - goose
          - phish
          - um
          - wsp
      skip_accuracy:
        description: 'Skip accuracy calculation to run pipeline faster'
        required: false
        default: false
        type: boolean

jobs:
  setup:
    name: Setup Dynamic Matrix
    runs-on: ubuntu-latest
    outputs:
      bands: ${{ steps.get_bands.outputs.bands }}
      bands_list: ${{ steps.get_bands.outputs.bands_list }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - id: get_bands
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.band || 'all' }}" != "all" ]]; then
            BANDS_JSON='["${{ github.event.inputs.band }}"]'
          else
            BANDS_JSON=$(python -m scripts.get_all_bands)
          fi
          echo "bands=$BANDS_JSON" >> $GITHUB_OUTPUT
          echo "bands_list=$BANDS_JSON" >> $GITHUB_OUTPUT

  daily-pipeline:
    name: Daily Pipeline - ${{ matrix.band }}
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      matrix:
        band: ${{ fromJson(needs.setup.outputs.bands) }}
      fail-fast: false

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PHISH_API_KEY: ${{ secrets.PHISH_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Validate required secrets
        run: |
          MISSING=()
          BAND="${{ matrix.band }}"
          
          # Check each secret by testing if it's empty
          if [[ -z "$SUPABASE_URL" ]]; then
            MISSING+=("SUPABASE_URL")
          fi
          
          if [[ -z "$SUPABASE_SERVICE_ROLE_KEY" ]]; then
            MISSING+=("SUPABASE_SERVICE_ROLE_KEY")
          fi
          
          # PHISH_API_KEY is only required for Phish collection
          if [[ "$BAND" == "phish" && -z "$PHISH_API_KEY" ]]; then
            MISSING+=("PHISH_API_KEY (required for phish only)")
          fi
          
          if [[ ${#MISSING[@]} -gt 0 ]]; then
            echo "::error::Missing required secrets: ${MISSING[*]}"
            exit 1
          fi
          
          echo "✅ All required secrets are configured"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --locked --no-dev

      - name: Install Playwright OS Dependencies
        if: matrix.band == 'wsp' || matrix.band == 'eggy'
        run: uv run python -m playwright install-deps firefox

      - name: Install Playwright Browsers
        if: matrix.band == 'wsp' || matrix.band == 'eggy'
        run: uv run python -m playwright install firefox

      - name: Compute Collection Preflight
        id: preflight
        env:
          BAND: ${{ matrix.band }}
        run: |
          echo "::group::Computing collection preflight for ${{ matrix.band }}"
          uv run python scripts/collection_preflight.py --band "${{ matrix.band }}"
          echo "::endgroup::"

      - name: Run Data Collection
        id: collection
        if: steps.preflight.outputs.should_run_collection == 'true'
        run: |
          echo "::group::Collecting data for ${{ matrix.band }}"

          BAND="${{ matrix.band }}"
          SCRIPT_PATH="scripts/run_${BAND}_collection.py"
          if [[ ! -f "$SCRIPT_PATH" ]]; then
            echo "::error::Collection script not found: $SCRIPT_PATH"
            exit 1
          fi

          MAX_RETRIES=3
          RETRY_COUNT=0
          RETRY_DELAY=30
          STEP_OUTPUT="$GITHUB_OUTPUT"
          ATTEMPT_OUTPUT="$(mktemp)"

          if [[ "$BAND" == "wsp" ]]; then
            FINAL_EXIT_CODE=0
            WORKFLOW_STATE="failed"
            SHOULD_RETRY="true"

            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              echo "Attempt $((RETRY_COUNT + 1)) of $MAX_RETRIES for ${BAND} collection"
              : > "$ATTEMPT_OUTPUT"

              set +e
              GITHUB_OUTPUT="$ATTEMPT_OUTPUT" uv run python "$SCRIPT_PATH"
              FINAL_EXIT_CODE=$?
              set -e

              WORKFLOW_STATE="$(grep '^workflow_state=' "$ATTEMPT_OUTPUT" | tail -n 1 | cut -d= -f2-)"
              SHOULD_RETRY="$(grep '^should_retry_collection=' "$ATTEMPT_OUTPUT" | tail -n 1 | cut -d= -f2-)"

              if [[ $FINAL_EXIT_CODE -eq 0 ]]; then
                if [[ "$WORKFLOW_STATE" == "degraded" ]]; then
                  echo "::warning::Collection for ${BAND} completed in degraded mode"
                else
                  echo "✅ Collection for ${BAND} successful"
                fi
                break
              fi

              if [[ "$SHOULD_RETRY" != "true" ]]; then
                echo "::warning::Collection for ${BAND} produced a non-retryable outcome"
                break
              fi

              RETRY_COUNT=$((RETRY_COUNT + 1))
              if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                echo "⚠️ Collection for ${BAND} failed, retrying in ${RETRY_DELAY} seconds..."
                sleep $RETRY_DELAY
              else
                echo "::error::Collection for ${BAND} failed after $MAX_RETRIES attempts"
              fi
            done

            cat "$ATTEMPT_OUTPUT" >> "$STEP_OUTPUT"

            if [[ $FINAL_EXIT_CODE -ne 0 && "${WORKFLOW_STATE:-failed}" == "failed" ]]; then
              exit $FINAL_EXIT_CODE
            fi
          else
            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              echo "Attempt $((RETRY_COUNT + 1)) of $MAX_RETRIES for ${BAND} collection"

              if uv run python "$SCRIPT_PATH"; then
                echo "✅ Collection for ${BAND} successful"
                break
              fi

              RETRY_COUNT=$((RETRY_COUNT + 1))
              if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                echo "⚠️ Collection for ${BAND} failed, retrying in ${RETRY_DELAY} seconds..."
                sleep $RETRY_DELAY
              else
                echo "::error::Collection for ${BAND} failed after $MAX_RETRIES attempts"
                exit 1
              fi
            done

            echo "workflow_state=success" >> "$STEP_OUTPUT"
            echo "outcome_code=success" >> "$STEP_OUTPUT"
            echo "should_retry_collection=false" >> "$STEP_OUTPUT"
            echo "recent_data_usable=true" >> "$STEP_OUTPUT"
            echo "prediction_action=generated" >> "$STEP_OUTPUT"
          fi
          
          echo "::endgroup::"

      - name: Seed Verify-Only Collection Outputs
        id: collection_idle
        if: steps.preflight.outputs.should_run_collection != 'true'
        run: |
          echo "workflow_state=success" >> "$GITHUB_OUTPUT"
          echo "outcome_code=success" >> "$GITHUB_OUTPUT"
          echo "should_retry_collection=false" >> "$GITHUB_OUTPUT"
          echo "recent_data_usable=true" >> "$GITHUB_OUTPUT"
          echo "prediction_action=skipped_idle" >> "$GITHUB_OUTPUT"

      - name: Verify Data Freshness
        id: data_check
        if: success() || steps.collection.outputs.workflow_state == 'degraded'
        env:
          BAND: ${{ matrix.band }}
        run: |
          echo "::group::Verifying data freshness for ${{ matrix.band }}"
          
          uv run python scripts/verify_data_freshness.py
          
          echo "::endgroup::"
          
      - name: Alert on Data Issues
        if: steps.data_check.outputs.missing_data == 'true'
        env:
          MISSING_COUNT: ${{ steps.data_check.outputs.missing_count }}
        run: |
          COUNT=${MISSING_COUNT:-0}
          if [[ "${{ matrix.band }}" == "wsp" && "${{ steps.collection.outputs.workflow_state }}" == "degraded" ]]; then
            echo "::warning::WSP degraded: ${COUNT} recent completed shows are missing setlist data."
            echo "Predictions will be reused or skipped rather than failing the full daily pipeline."
          else
            echo "::error::Critical: ${COUNT} recent ${{ matrix.band }} shows are missing setlist data!"
            echo "This may cause predictions to include songs that were recently played."
            echo "Consider running the collection script manually to fetch missing setlists."
          fi
          
      - name: Generate Predictions (Notebook & Deal)
        id: predictions
        if: steps.preflight.outputs.should_run_collection == 'true' && steps.collection.outputs.workflow_state != 'degraded'
        run: |
          echo "::group::Generating predictions for ${{ matrix.band }}"

          # Generate for the next upcoming show (default behavior)
          uv run python scripts/generate_predictions.py --band ${{ matrix.band }} --model notebook --require-output
          uv run python scripts/generate_predictions.py --band ${{ matrix.band }} --model deal --require-output

          # Also generate for the most recent completed show to power setlist highlighting
          echo "Finding last completed show date..."
          LAST_COMPLETED_DATE=$(uv run python scripts/get_last_completed_show_date.py --band ${{ matrix.band }})

          if [[ -n "$LAST_COMPLETED_DATE" ]]; then
            echo "Last completed show date is $LAST_COMPLETED_DATE. Generating predictions for this date."
            uv run python scripts/generate_predictions.py --band ${{ matrix.band }} --model notebook --date $LAST_COMPLETED_DATE --require-output
            uv run python scripts/generate_predictions.py --band ${{ matrix.band }} --model deal --date $LAST_COMPLETED_DATE --require-output
          else
            echo "Could not determine last completed show date. Skipping predictions for it."
          fi

          echo "::endgroup::"

      - name: Rebuild Prediction Projection Window
        if: steps.preflight.outputs.should_run_collection == 'true' && steps.collection.outputs.workflow_state != 'degraded'
        run: |
          echo "::group::Rebuilding prediction_songs window for ${{ matrix.band }}"

          uv run python scripts/rebuild_prediction_songs.py \
            --band ${{ matrix.band }} \
            --reference-date-from "${{ steps.preflight.outputs.recent_window_start }}" \
            --reference-date-to "${{ steps.preflight.outputs.lookahead_end }}"

          echo "::endgroup::"

      - name: Validate Prediction Tables
        id: prediction_validation
        if: steps.preflight.outputs.should_run_collection == 'true' && steps.collection.outputs.workflow_state != 'degraded'
        run: |
          echo "::group::Validating prediction table freshness for ${{ matrix.band }}"
          uv run python scripts/validate_prediction_tables.py --band ${{ matrix.band }} --max-age-hours 72
          echo "::endgroup::"

      - name: Run Backtest and Calculate Aggregate Accuracy
        id: accuracy_calc
        if: github.event.inputs.skip_accuracy != 'true' && steps.preflight.outputs.should_run_collection == 'true' && steps.collection.outputs.workflow_state != 'degraded'
        run: |
          echo "::group::Running backtest for ${{ matrix.band }}"
          
          # Run backtest for last 50 shows to populate per-show accuracy
          uv run python scripts/run_backtest.py --band ${{ matrix.band }} --model notebook --shows 50 --require-results
          uv run python scripts/run_backtest.py --band ${{ matrix.band }} --model deal --shows 50 --require-results

          echo "::endgroup::"

      - name: Validate Accuracy Tables
        id: accuracy_validation
        if: github.event.inputs.skip_accuracy != 'true' && steps.preflight.outputs.should_run_collection == 'true' && steps.collection.outputs.workflow_state != 'degraded'
        run: |
          echo "::group::Validating accuracy tables for ${{ matrix.band }}"
          uv run python scripts/validate_accuracy_tables.py --band ${{ matrix.band }} --max-age-hours 72
          echo "::endgroup::"

      - name: Audit Supported Model Freshness
        id: freshness_audit
        if: always() && steps.preflight.outputs.should_run_collection == 'true'
        run: |
          echo "::group::Auditing supported-model freshness for ${{ matrix.band }}"

          ARGS=(--band ${{ matrix.band }} --max-age-hours 48)
          if [[ "${{ github.event.inputs.skip_accuracy }}" == "true" ]]; then
            ARGS+=(--skip-accuracy)
          fi

          uv run python -m scripts.check_supported_model_freshness "${ARGS[@]}"

          echo "::endgroup::"

      - name: Audit Website Supabase Tables
        id: supabase_audit
        if: always() && steps.preflight.outputs.should_run_collection == 'true'
        env:
          AUDIT_PATH: .github/workflow-audits/${{ matrix.band }}.json
        run: |
          echo "::group::Auditing website-facing Supabase tables for ${{ matrix.band }}"

          mkdir -p .github/workflow-audits
          ARGS=(--band ${{ matrix.band }} --max-age-hours 72 --output "$AUDIT_PATH")
          if [[ "${{ github.event.inputs.skip_accuracy }}" == "true" ]]; then
            ARGS+=(--skip-accuracy)
          fi

          set +e
          uv run python -m scripts.audit_supabase_tables "${ARGS[@]}"
          AUDIT_EXIT=$?
          set -e

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["AUDIT_PATH"])
          github_output = os.environ["GITHUB_OUTPUT"]

          state = "unknown"
          blocker_count = 0
          warning_count = 0
          if path.exists():
              payload = json.loads(path.read_text())
              state = str(payload.get("state", "unknown"))
              blocker_count = len(payload.get("blockers", []))
              warning_count = len(payload.get("warnings", []))

          with open(github_output, "a", encoding="utf-8") as handle:
              handle.write(f"audit_state={state}\n")
              handle.write(f"audit_blocker_count={blocker_count}\n")
              handle.write(f"audit_warning_count={warning_count}\n")
          PY

          echo "::endgroup::"
          exit $AUDIT_EXIT

      - name: Write Band Status
        if: always()
        env:
          BAND: ${{ matrix.band }}
          WORKFLOW_STATE: ${{ steps.collection.outputs.workflow_state || steps.collection_idle.outputs.workflow_state || (job.status == 'success' && 'success' || 'failed') }}
          OUTCOME_CODE: ${{ steps.collection.outputs.outcome_code || steps.collection_idle.outputs.outcome_code || (job.status == 'success' && 'success' || 'failed_internal') }}
          RECENT_DATA_USABLE: ${{ steps.collection.outputs.recent_data_usable || steps.collection_idle.outputs.recent_data_usable || 'false' }}
          FALLBACK_SHOWS_FILLED: ${{ steps.collection.outputs.fallback_shows_filled || '0' }}
          FALLBACK_SETLISTS_COLLECTED: ${{ steps.collection.outputs.fallback_setlists_collected || '0' }}
          COLLECTOR_MISSING_SETLISTS: ${{ steps.collection.outputs.collector_missing_setlists || '0' }}
          REQUEST_BLOCKED_MISSING_SETLISTS: ${{ steps.collection.outputs.request_blocked_missing_setlists || '0' }}
          UPSTREAM_MISSING_SETLISTS: ${{ steps.collection.outputs.upstream_missing_setlists || '0' }}
          FALLBACK_AVAILABLE_MISSING_SETLISTS: ${{ steps.collection.outputs.fallback_available_missing_setlists || '0' }}
          FAILURE_REASON: ${{ steps.collection.outputs.failure_reason || '' }}
          MISSING_DATA: ${{ steps.data_check.outputs.missing_data || 'false' }}
          MISSING_COUNT: ${{ steps.data_check.outputs.missing_count || '0' }}
          PREDICTIONS_OUTCOME: ${{ steps.predictions.outcome || '' }}
          ACCURACY_SKIPPED: ${{ github.event.inputs.skip_accuracy == 'true' }}
          COLLECTION_MODE: ${{ steps.preflight.outputs.collection_mode || 'unknown' }}
          EXECUTION_MODE: ${{ steps.preflight.outputs.execution_mode || 'unknown' }}
          SHOULD_RUN_COLLECTION: ${{ steps.preflight.outputs.should_run_collection || 'false' }}
          RECENT_COMPLETED_SHOW_COUNT: ${{ steps.preflight.outputs.recent_completed_show_count || '0' }}
          MISSING_RECENT_SETLIST_COUNT: ${{ steps.preflight.outputs.missing_recent_setlist_count || '0' }}
          UPCOMING_SHOW_COUNT: ${{ steps.preflight.outputs.upcoming_show_count || '0' }}
          LAST_SUCCESSFUL_COLLECTION_AT: ${{ steps.preflight.outputs.last_successful_collection_at || '' }}
          FRESHNESS_STATE: ${{ steps.freshness_audit.outputs.freshness_state || 'unknown' }}
          STALE_PREDICTION_MODELS: ${{ steps.freshness_audit.outputs.stale_prediction_models || '' }}
          STALE_ACCURACY_MODELS: ${{ steps.freshness_audit.outputs.stale_accuracy_models || '' }}
          MAX_PREDICTION_AGE_HOURS: ${{ steps.freshness_audit.outputs.max_prediction_age_hours || '' }}
          MAX_ACCURACY_AGE_HOURS: ${{ steps.freshness_audit.outputs.max_accuracy_age_hours || '' }}
          FRESHNESS_REASON: ${{ steps.freshness_audit.outputs.freshness_reason || '' }}
          SUPABASE_AUDIT_STATE: ${{ steps.supabase_audit.outputs.audit_state || 'unknown' }}
          SUPABASE_AUDIT_BLOCKER_COUNT: ${{ steps.supabase_audit.outputs.audit_blocker_count || '0' }}
          SUPABASE_AUDIT_WARNING_COUNT: ${{ steps.supabase_audit.outputs.audit_warning_count || '0' }}
        run: |
          mkdir -p .github/workflow-status
          python - <<'PY'
          import json
          import os

          workflow_state = os.environ.get("WORKFLOW_STATE", "failed")
          missing_data = os.environ.get("MISSING_DATA", "false") == "true"
          recent_data_usable = os.environ.get("RECENT_DATA_USABLE", "false") == "true"

          if workflow_state == "degraded":
              prediction_action = "reused_existing" if recent_data_usable and not missing_data else "skipped"
          elif os.environ.get("PREDICTIONS_OUTCOME") == "success":
              prediction_action = "generated"
          elif os.environ.get("WORKFLOW_STATE") == "failed":
              prediction_action = "skipped"
          else:
              prediction_action = os.environ.get("prediction_action", "pending")

          def parse_model_list(value: str | None) -> list[str]:
              if not value:
                  return []
              return [item.strip() for item in value.split(",") if item.strip()]

          def parse_optional_float(value: str | None):
              if value in (None, ""):
                  return None
              try:
                  return float(value)
              except ValueError:
                  return None

          payload = {
              "band": os.environ["BAND"],
              "workflow_state": workflow_state,
              "outcome_code": os.environ.get("OUTCOME_CODE", "failed_internal"),
              "recent_data_usable": recent_data_usable,
              "missing_data": missing_data,
              "missing_count": int(os.environ.get("MISSING_COUNT", "0") or 0),
              "prediction_action": prediction_action,
              "collection_mode": os.environ.get("COLLECTION_MODE", "unknown"),
              "execution_mode": os.environ.get("EXECUTION_MODE", "unknown"),
              "should_run_collection": os.environ.get("SHOULD_RUN_COLLECTION", "false") == "true",
              "recent_completed_show_count": int(os.environ.get("RECENT_COMPLETED_SHOW_COUNT", "0") or 0),
              "missing_recent_setlist_count": int(os.environ.get("MISSING_RECENT_SETLIST_COUNT", "0") or 0),
              "upcoming_show_count": int(os.environ.get("UPCOMING_SHOW_COUNT", "0") or 0),
              "last_successful_collection_at": os.environ.get("LAST_SUCCESSFUL_COLLECTION_AT", ""),
              "fallback_shows_filled": int(os.environ.get("FALLBACK_SHOWS_FILLED", "0") or 0),
              "fallback_setlists_collected": int(os.environ.get("FALLBACK_SETLISTS_COLLECTED", "0") or 0),
              "collector_missing_setlists": int(os.environ.get("COLLECTOR_MISSING_SETLISTS", "0") or 0),
              "request_blocked_missing_setlists": int(os.environ.get("REQUEST_BLOCKED_MISSING_SETLISTS", "0") or 0),
              "upstream_missing_setlists": int(os.environ.get("UPSTREAM_MISSING_SETLISTS", "0") or 0),
              "fallback_available_missing_setlists": int(os.environ.get("FALLBACK_AVAILABLE_MISSING_SETLISTS", "0") or 0),
              "failure_reason": os.environ.get("FAILURE_REASON", ""),
              "accuracy_skipped": os.environ.get("ACCURACY_SKIPPED", "false") == "true",
              "freshness_state": os.environ.get("FRESHNESS_STATE", "unknown"),
              "stale_prediction_models": parse_model_list(os.environ.get("STALE_PREDICTION_MODELS")),
              "stale_accuracy_models": parse_model_list(os.environ.get("STALE_ACCURACY_MODELS")),
              "max_prediction_age_hours": parse_optional_float(os.environ.get("MAX_PREDICTION_AGE_HOURS")),
              "max_accuracy_age_hours": parse_optional_float(os.environ.get("MAX_ACCURACY_AGE_HOURS")),
              "freshness_reason": os.environ.get("FRESHNESS_REASON", ""),
              "supabase_audit_state": os.environ.get("SUPABASE_AUDIT_STATE", "unknown"),
              "supabase_audit_blocker_count": int(os.environ.get("SUPABASE_AUDIT_BLOCKER_COUNT", "0") or 0),
              "supabase_audit_warning_count": int(os.environ.get("SUPABASE_AUDIT_WARNING_COUNT", "0") or 0),
          }

          path = f".github/workflow-status/{payload['band']}.json"
          with open(path, "w", encoding="utf-8") as handle:
              json.dump(payload, handle)
          print(f"Wrote {path}")
          PY

      - name: Upload Band Status
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: band-status-${{ matrix.band }}
          path: .github/workflow-status/${{ matrix.band }}.json
          if-no-files-found: error

      - name: Upload Supabase Audit
        if: always() && steps.preflight.outputs.should_run_collection == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: supabase-audit-${{ matrix.band }}
          path: .github/workflow-audits/${{ matrix.band }}.json
          if-no-files-found: error

      - name: Append Band Summary
        if: always()
        env:
          BAND: ${{ matrix.band }}
          WORKFLOW_STATE: ${{ steps.collection.outputs.workflow_state || steps.collection_idle.outputs.workflow_state || (job.status == 'success' && 'success' || 'failed') }}
          OUTCOME_CODE: ${{ steps.collection.outputs.outcome_code || steps.collection_idle.outputs.outcome_code || (job.status == 'success' && 'success' || 'failed_internal') }}
          MISSING_COUNT: ${{ steps.data_check.outputs.missing_count || '0' }}
          EXECUTION_MODE: ${{ steps.preflight.outputs.execution_mode || 'unknown' }}
          FRESHNESS_STATE: ${{ steps.freshness_audit.outputs.freshness_state || 'unknown' }}
          STALE_PREDICTION_MODELS: ${{ steps.freshness_audit.outputs.stale_prediction_models || '' }}
          STALE_ACCURACY_MODELS: ${{ steps.freshness_audit.outputs.stale_accuracy_models || '' }}
          MAX_PREDICTION_AGE_HOURS: ${{ steps.freshness_audit.outputs.max_prediction_age_hours || '' }}
          MAX_ACCURACY_AGE_HOURS: ${{ steps.freshness_audit.outputs.max_accuracy_age_hours || '' }}
          SUPABASE_AUDIT_STATE: ${{ steps.supabase_audit.outputs.audit_state || 'unknown' }}
          SUPABASE_AUDIT_BLOCKER_COUNT: ${{ steps.supabase_audit.outputs.audit_blocker_count || '0' }}
          SUPABASE_AUDIT_WARNING_COUNT: ${{ steps.supabase_audit.outputs.audit_warning_count || '0' }}
        run: |
          echo "### ${BAND^^}" >> $GITHUB_STEP_SUMMARY
          echo "- Execution mode: ${EXECUTION_MODE}" >> $GITHUB_STEP_SUMMARY
          echo "- State: ${WORKFLOW_STATE}" >> $GITHUB_STEP_SUMMARY
          echo "- Outcome: ${OUTCOME_CODE}" >> $GITHUB_STEP_SUMMARY
          echo "- Missing recent setlists: ${MISSING_COUNT}" >> $GITHUB_STEP_SUMMARY
          echo "- Supported model freshness: ${FRESHNESS_STATE}" >> $GITHUB_STEP_SUMMARY
          if [[ -n "${STALE_PREDICTION_MODELS}" ]]; then
            echo "- Stale supported-model predictions: ${STALE_PREDICTION_MODELS}" >> $GITHUB_STEP_SUMMARY
          fi
          if [[ -n "${STALE_ACCURACY_MODELS}" ]]; then
            echo "- Stale supported-model accuracy: ${STALE_ACCURACY_MODELS}" >> $GITHUB_STEP_SUMMARY
          fi
          if [[ -n "${MAX_PREDICTION_AGE_HOURS}" ]]; then
            echo "- Max prediction age: ${MAX_PREDICTION_AGE_HOURS}h" >> $GITHUB_STEP_SUMMARY
          fi
          if [[ -n "${MAX_ACCURACY_AGE_HOURS}" ]]; then
            echo "- Max accuracy age: ${MAX_ACCURACY_AGE_HOURS}h" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- Website Supabase audit: ${SUPABASE_AUDIT_STATE} (blockers=${SUPABASE_AUDIT_BLOCKER_COUNT}, warnings=${SUPABASE_AUDIT_WARNING_COUNT})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Enforce Supported Model Freshness
        if: always() && steps.preflight.outputs.should_run_collection == 'true'
        env:
          BAND: ${{ matrix.band }}
          WORKFLOW_STATE: ${{ steps.collection.outputs.workflow_state || steps.collection_idle.outputs.workflow_state || (job.status == 'success' && 'success' || 'failed') }}
          FRESHNESS_STATE: ${{ steps.freshness_audit.outputs.freshness_state || 'unknown' }}
          STALE_PREDICTION_MODELS: ${{ steps.freshness_audit.outputs.stale_prediction_models || '' }}
          STALE_ACCURACY_MODELS: ${{ steps.freshness_audit.outputs.stale_accuracy_models || '' }}
          FRESHNESS_REASON: ${{ steps.freshness_audit.outputs.freshness_reason || '' }}
          ACCURACY_SKIPPED: ${{ github.event.inputs.skip_accuracy == 'true' }}
        run: |
          if [[ "${FRESHNESS_STATE}" != "stale" ]]; then
            echo "Supported-model freshness state for ${BAND}: ${FRESHNESS_STATE}"
            exit 0
          fi

          if [[ -n "${STALE_PREDICTION_MODELS}" ]]; then
            if [[ "${WORKFLOW_STATE}" == "degraded" ]]; then
              echo "::error::${BAND} degraded reuse exceeded the 48h prediction freshness window for supported models: ${STALE_PREDICTION_MODELS}. ${FRESHNESS_REASON}"
            else
              echo "::error::${BAND} regeneration completed but supported-model predictions remained stale: ${STALE_PREDICTION_MODELS}. ${FRESHNESS_REASON}"
            fi
            exit 1
          fi

          if [[ "${ACCURACY_SKIPPED}" != "true" && -n "${STALE_ACCURACY_MODELS}" ]]; then
            if [[ "${WORKFLOW_STATE}" == "degraded" ]]; then
              echo "::error::${BAND} degraded reuse exceeded the 48h accuracy freshness window for supported models: ${STALE_ACCURACY_MODELS}. ${FRESHNESS_REASON}"
            else
              echo "::error::${BAND} regeneration completed but supported-model accuracy remained stale: ${STALE_ACCURACY_MODELS}. ${FRESHNESS_REASON}"
            fi
            exit 1
          fi

          echo "Supported-model freshness reported stale, but no enforced stale surface remained."

  pipeline-summary:
    name: Pipeline Summary
    needs: [setup, daily-pipeline]
    if: always()
    runs-on: ubuntu-latest
    
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      BAND_LIST_JSON: ${{ needs.setup.outputs.bands_list }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download band status artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: band-status-*
          path: .github/workflow-status
          merge-multiple: true
        
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --no-dev
          
      - name: Generate pipeline summary header
        run: |
          echo "## Daily Pipeline Summary - $(date)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          status_dir = Path(".github/workflow-status")
          statuses = []
          if status_dir.exists():
              for path in sorted(status_dir.glob("*.json")):
                  with open(path, encoding="utf-8") as handle:
                      statuses.append(json.load(handle))

          has_failed = any(item.get("workflow_state") == "failed" for item in statuses)
          has_degraded = any(item.get("workflow_state") == "degraded" for item in statuses)
          has_stale_freshness = any(item.get("freshness_state") == "stale" for item in statuses)
          has_warning_freshness = any(item.get("freshness_state") == "warning" for item in statuses)

          if has_failed and has_stale_freshness:
              print("⚠️ **One or more band pipelines failed, including supported-model freshness escalation.**")
              print("")
              print("Please check the failed band jobs plus the Supported Model Freshness and Band Run Health sections below.")
          elif has_failed:
              print("⚠️ **One or more band pipelines failed.**")
              print("")
              print("Please check the failed band jobs and the run health table below.")
          elif has_stale_freshness:
              print("⚠️ **Supported-model freshness is stale for one or more bands.**")
              print("")
              print("Review the Supported Model Freshness section below even if collection degraded gracefully.")
          elif has_degraded:
              print("⚠️ **All band pipelines completed, but at least one band ran in degraded mode.**")
              print("")
              print("Review the band run health table below for partial upstream issues.")
          elif has_warning_freshness:
              print("⚠️ **One or more bands reused fresh predictions but skipped accuracy enforcement for this run.**")
              print("")
              print("Review the Supported Model Freshness section below for informational stale accuracy notes.")
          else:
              print("✅ **All band pipelines completed successfully.**")
          PY

      - name: Generate monitoring summary
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          STATUS_ARGS=()
          for file in .github/workflow-status/*.json; do
            if [[ -f "$file" ]]; then
              STATUS_ARGS+=(--status-file "$file")
            fi
          done
          uv run python scripts/generate_pipeline_summary.py --bands-json "$BAND_LIST_JSON" "${STATUS_ARGS[@]}" >> $GITHUB_STEP_SUMMARY
          
      - name: Add next steps
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps:" >> $GITHUB_STEP_SUMMARY
          echo "- Open the JamBandNerd website deployment to review updated predictions." >> $GITHUB_STEP_SUMMARY
          echo "- Check the Supabase dashboard for data validation." >> $GITHUB_STEP_SUMMARY
          echo "- Review any warnings above and re-run collection if needed." >> $GITHUB_STEP_SUMMARY

  notify-discord:
    name: Notify Discord
    needs: [daily-pipeline, pipeline-summary]
    if: failure()
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - name: Post status to Discord
        if: env.DISCORD_WEBHOOK_URL != ''
        env:
          WORKFLOW_STATUS: ${{ needs.daily-pipeline.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          STATUS_TEXT="⚠️ Daily pipeline completed with issues (check GitHub Actions)"

          payload=$(STATUS_TEXT="$STATUS_TEXT" python - <<'PY'
          import json, os
          content = f"{os.environ['STATUS_TEXT']}\n{os.environ['RUN_URL']}"
          print(json.dumps({"content": content}))
          PY
          )

          curl -sS -X POST -H "Content-Type: application/json" -d "$payload" "$DISCORD_WEBHOOK_URL"
          
