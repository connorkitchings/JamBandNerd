name: Repo Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-repo:
    name: Verify Repository
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install project
        run: uv sync --locked --extra dev

      - name: Verify Python surface
        run: npm run verify:python

      - name: Verify version surfaces
        run: uv run python scripts/check_version_sync.py

      - name: Verify documentation surface
        run: npm run verify:docs

      - name: Ensure verification leaves tracked files clean
        run: npm run verify:clean
