name: Repo Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-repo:
    name: Verify Repository
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install project
        run: uv sync --locked --extra dev

      - name: Lint Python source
        run: uv run ruff check src tests scripts

      - name: Verify version surfaces
        run: uv run python scripts/check_version_sync.py

      - name: Build documentation
        run: uv run --with mkdocs --with mkdocs-material --with pymdown-extensions mkdocs build --strict

      - name: Run targeted model and pipeline tests
        run: |
          uv run pytest tests/models tests/pipeline/test_run_backtest.py tests/pipeline/test_run_optimized_pipeline.py tests/test_check_supported_model_freshness.py tests/test_generate_pipeline_summary.py
