name: Fantasy Goose

on:
  workflow_run:
    workflows:
      - Daily Data Pipeline
    types:
      - completed
  workflow_dispatch:
    inputs:
      date:
        description: "Target show date (YYYY-MM-DD). Defaults to today in ET."
        required: false
        type: string
      dry_run:
        description: "Resolve the target show and picks but do not submit."
        required: false
        default: false
        type: boolean

jobs:
  check-goose-predictions:
    name: Check Goose Predictions
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    outputs:
      should_play: ${{ steps.gate.outputs.should_play }}
    permissions:
      contents: read
      actions: read

    steps:
      - name: Download Goose band status
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v8
        with:
          name: band-status-goose
          run-id: ${{ github.event.workflow_run.id }}
          path: band-status
        continue-on-error: true

      - name: Gate on Goose prediction success
        id: gate
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_play=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch — skipping gate."
            exit 0
          fi

          STATUS_FILE="band-status/goose.json"
          if [[ ! -f "$STATUS_FILE" ]]; then
            echo "should_play=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Goose band-status artifact found. Skipping Fantasy Goose."
            exit 0
          fi

          PREDICTION_ACTION=$(python3 -c "
          import json, sys
          with open('$STATUS_FILE') as f:
              print(json.load(f).get('prediction_action', 'unknown'))
          ")

          WORKFLOW_STATE=$(python3 -c "
          import json, sys
          with open('$STATUS_FILE') as f:
              print(json.load(f).get('workflow_state', 'unknown'))
          ")

          echo "Goose workflow_state=${WORKFLOW_STATE} prediction_action=${PREDICTION_ACTION}"

          if [[ "$WORKFLOW_STATE" == "failed" ]]; then
            echo "should_play=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Goose band pipeline failed. Skipping Fantasy Goose."
            exit 0
          fi

          if [[ "$PREDICTION_ACTION" != "generated" ]]; then
            echo "should_play=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Goose predictions not freshly generated (action=${PREDICTION_ACTION}). Skipping Fantasy Goose."
            exit 0
          fi

          echo "should_play=true" >> "$GITHUB_OUTPUT"
          echo "Goose predictions freshly generated. Proceeding to play."

  play-fantasy-goose:
    name: Play Fantasy Goose
    needs: check-goose-predictions
    if: needs.check-goose-predictions.outputs.should_play == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      FG_USER_EMAIL: ${{ secrets.FG_USER_EMAIL }}
      FG_PASSWORD: ${{ secrets.FG_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate required secrets
        run: |
          MISSING=()
          [[ -z "$SUPABASE_URL" ]] && MISSING+=("SUPABASE_URL")
          [[ -z "$SUPABASE_SERVICE_ROLE_KEY" ]] && MISSING+=("SUPABASE_SERVICE_ROLE_KEY")
          [[ -z "$FG_USER_EMAIL" ]] && MISSING+=("FG_USER_EMAIL")
          [[ -z "$FG_PASSWORD" ]] && MISSING+=("FG_PASSWORD")

          if [[ ${#MISSING[@]} -gt 0 ]]; then
            echo "::error::Missing required secrets: ${MISSING[*]}"
            exit 1
          fi

      - name: Install dependencies
        run: uv sync --locked --no-dev

      - name: Install Playwright OS Dependencies
        run: uv run python -m playwright install-deps chromium

      - name: Cache Playwright Browsers
        uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('uv.lock') }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: uv run python -m playwright install chromium

      - name: Play Fantasy Goose
        id: play
        run: |
          CMD=(uv run python scripts/play_fantasy_goose.py)

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.date }}" ]]; then
            CMD+=(--date "${{ github.event.inputs.date }}")
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.dry_run }}" == "true" ]]; then
            CMD+=(--dry-run)
          fi

          "${CMD[@]}"

      - name: Fail on mapping or submission error
        if: steps.play.outputs.status == 'mapping_failed' || steps.play.outputs.status == 'missing_predictions'
        run: |
          echo "::error::Fantasy Goose automation finished with status '${{ steps.play.outputs.status }}'"
          exit 1
