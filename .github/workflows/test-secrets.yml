name: Test Secrets Availability

on:
  workflow_dispatch:  # Allow manual triggering

jobs:
  check-secrets:
    name: Check for Required Secrets
    runs-on: ubuntu-latest

    steps:
    - name: Verify Secrets
      run: |
        if [ -z "${{ secrets.PHISH_API_KEY }}" ]; then
          echo "Error: PHISH_API_KEY secret is not set."
          exit 1
        fi
        if [ -z "${{ secrets.SUPABASE_URL }}" ]; then
          echo "Error: SUPABASE_URL secret is not set."
          exit 1
        fi
        if [ -z "${{ secrets.SUPABASE_KEY }}" ]; then
          echo "Error: SUPABASE_KEY secret is not set."
          exit 1
        fi
        if [ -z "${{ secrets.ACTIONS_PAT2 }}" ]; then
          echo "Error: ACTIONS_PAT2 secret is not set."
          exit 1
        fi
        echo "All required secrets are present."
