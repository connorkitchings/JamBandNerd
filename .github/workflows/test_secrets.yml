name: Test Secrets Availability

on:
  workflow_dispatch:  # Allow manual triggering

jobs:
  check-secrets:
    name: Check for Required Secrets
    runs-on: ubuntu-latest

    steps:
      - name: Verify Secrets
        run: |
          MISSING=()

          if [[ -z "${{ secrets.SUPABASE_URL }}" ]]; then
            MISSING+=("SUPABASE_URL")
          fi

          if [[ -z "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]]; then
            MISSING+=("SUPABASE_SERVICE_ROLE_KEY")
          fi

          if [[ ${#MISSING[@]} -gt 0 ]]; then
            echo "::error::Missing required secrets: ${MISSING[*]}"
            exit 1
          fi

          if [[ -z "${{ secrets.PHISH_API_KEY }}" ]]; then
            echo "::warning::PHISH_API_KEY is not set. Non-Phish workflows can still run, but Phish collection and live tracking will fail."
          fi

          echo "Required secrets are present."
