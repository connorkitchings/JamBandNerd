name: Daily Goose Pipeline

on:
  schedule:
    - cron: '0 8 * * *' # Runs at 8:00 AM UTC daily
  workflow_dispatch: # Allows manual triggering

jobs:
  run-goose-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Configure uv path
        run: echo "PATH=$HOME/.cargo/bin:$PATH" >> $GITHUB_ENV

      - name: Install dependencies
        run: uv pip install .

      - name: Run Goose Data Collection
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: uv run python scripts/run_goose_collection.py

      - name: Generate Goose Predictions
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: uv run python scripts/generate_goose_predictions.py

      - name: Save Notebook Accuracy
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: uv run python scripts/save_notebook_accuracy.py
