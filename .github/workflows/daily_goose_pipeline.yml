name: Daily Goose Pipeline

on:
  schedule:
    - cron: '0 19 * * *' # Runs daily at 19:00 UTC (3:00 PM ET during DST)
  workflow_dispatch: # Allows manual triggering

jobs:
  run-goose-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Generate Goose Predictions
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/generate_goose_predictions.py

      - name: Save Notebook Accuracy
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/save_notebook_accuracy.py