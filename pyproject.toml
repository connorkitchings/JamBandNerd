[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jambandnerd"
version = "0.1.0"
description = "Modular data science platform for jam band setlists, pipelines, and analytics."
authors = [
  { name = "Connor Kitchings" }
]
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
  "pandas",
  "requests",
  "python-dotenv",
  # lxml 4.9.3 is last known stable for Python <=3.12; Python 3.13+ may not be supported yet
  "lxml==4.9.3",
  "supabase",
  "streamlit",
  "beautifulsoup4",
  "psycopg2-binary",
  "typer",
  "tqdm"
]

[project.optional-dependencies]
dev = [
  "ruff",
  "black",
  "pytest"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
# UV-specific configuration (if needed)

[tool.ruff]
line-length = 88  # defaults to 88, matching Black
target-version = "py312"
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff.lint]
extend-select = ["I"]
