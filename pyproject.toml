[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jambandnerd"
version = "0.1.0"
description = "Modular data science platform for jam band setlists, pipelines, and analytics."
authors = [
  { name = "Connor Kitchings" }
]
requires-python = "~=3.12.0"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
  "pandas",
  "requests",
  "python-dotenv",
  # lxml 4.9.3 is last known stable for Python <=3.12; Python 3.13+ may not be supported yet
  "lxml==4.9.3",
  "supabase",
    "beautifulsoup4",
  "psycopg2-binary",
  "typer",
  "tqdm",
  "pytest>=8.4.1",
  "playwright>=1.40.0",
]

[project.optional-dependencies]
dev = [
  "ruff",
  "black",
  "pytest",
  "mypy",
  "pytest-cov"
]
docs = [
  "mkdocs",
  "mkdocs-material",
  "pymdown-extensions"
]

[project.scripts]
collect-goose = "scripts.run_goose_collection:main"
collect-eggy = "scripts.run_eggy_collection:main"
collect-phish = "scripts.run_phish_collection:main"
collect-billy = "scripts.run_billy_collection:main"
collect-um = "scripts.run_um_collection:main"
predict-goose = "scripts.generate_goose_predictions:main"
predict-phish = "scripts.generate_phish_predictions:main"
predict-billy = "scripts.generate_billy_predictions:main"
predict-billy-ckplus = "scripts.generate_billy_ckplus_predictions:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
# UV-specific configuration (if needed)

[tool.ruff]
line-length = 88  # defaults to 88, matching Black
target-version = "py312"

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Many scripts intentionally modify `sys.path` before importing project modules, which
# triggers `E402` even though this is required for correct runtime behavior when the
# scripts are executed directly.
"scripts/*.py" = ["E402"]
"scripts/**/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v"
markers = [
  "live: exercises real upstreams and Supabase publishing paths",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
