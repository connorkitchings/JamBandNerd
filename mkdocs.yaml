site_name: JamBandNerd
site_description: Cloud-based jam band setlist prediction platform
repo_url: https://github.com/connorkitchings/JamBandNerd
repo_name: connorkitchings/JamBandNerd
edit_uri: edit/main/docs/

docs_dir: docs
use_directory_urls: true

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy
    - search.highlight

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - codehilite:
      use_pygments: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - attr_list
  - md_in_html

plugins:
  - search

nav:
  - Home: index.md
  - Status: overview/implementation_status.md
  - User Guide:
      - Getting Started: user/getting_started.md
      - Pipeline Usage: user/pipeline_usage.md
      - Configuration: user/configuration.md
  - Contributor Guide:
      - Onboarding: contributor/onboarding.md
      - Architecture: contributor/developer_guide/architecture.md
      - Extending the Platform: contributor/developer_guide/extending_the_platform.md
      - Agentic Development: contributor/developer_guide/ai_sessions.md
  - Operations:
      - Daily Pipeline: operations/github_actions.md
      - Data Recovery & Rebuild: operations/data_recovery_rebuild.md
      - Pipeline Optimization: operations/pipeline_optimization.md
      - Streamlit Deployment: operations/streamlit_deploy.md
      - TourWrangler Fallback (WSP): operations/tourwrangler_fallback.md
  - Reference:
      - Collectors:
          - WSP Improvements: reference/collectors/wsp_improvements.md
      - Specifications:
          - Technical Overview: reference/specifications/technical_overview.md
          - Data Strategy: reference/specifications/data_strategy.md
          - CLI & Scripts: reference/specifications/cli.md
          - Database: reference/specifications/database.md
          - Goose Pipeline: reference/specifications/goose_pipeline.md
          - Transformations: reference/specifications/transformations.md
          - Predictions Schema: reference/specifications/predictions_schema.md
      - Schemas:
          - Unified Tables: reference/schemas/unified_tables.md
          - Goose API: reference/schemas/goose_api.md
          - Phish API: reference/schemas/phish_api.md
          - WSP Webscrape: reference/schemas/wsp_webscrape.md
          - UM AllThings: reference/schemas/um_allthings.md
      - Models:
          - Overview: reference/models/index.md
          - Notebook Model: reference/models/notebook.md
          - CK+ Model: reference/models/ckplus.md
      - Guides:
          - Supabase API Guide: reference/guides/supabase_api_guide.md
          - Supabase Inserts: reference/guides/supabase_inserts.md
  - Troubleshooting:
      - Data Ingestion & Streamlit Issues: troubleshooting/data_ingestion_and_streamlit_issues.md
      - Validation Fix Log (2025-10-04): troubleshooting/VALIDATION_FIX_2025-10-04.md
      - Data Quality Checklist: troubleshooting/troubleshooting_data_quality.md
  - Project Docs:
      - Product Requirements: overview/project/prd.md
      - Architecture Decisions: overview/project/adr.md
      - Implementation Schedule: overview/project/schedule.md
  - Reports:
      - Improvements Summary: reports/IMPROVEMENTS_SUMMARY.md
      - Validation Improvements: reports/VALIDATION_IMPROVEMENTS.md
      - Validation Test Report: reports/TEST_REPORT_VALIDATION.md
  - Logs: logs/index.md
  - Archive:
      - Implementation Guide: archive/implementation_guide.md
