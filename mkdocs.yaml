site_name: JamBandNerd
site_description: Cloud-based jam band setlist prediction platform
repo_url: https://github.com/connorkitchings/JamBandNerd
repo_name: connorkitchings/JamBandNerd
edit_uri: edit/main/docs/

docs_dir: docs
use_directory_urls: true

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy
    - search.highlight

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - codehilite:
      use_pygments: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - attr_list
  - md_in_html

plugins:
  - search

nav:
  - Home: index.md
  - Status: IMPLEMENTATION_STATUS.md
  - User Guide:
      - Getting Started: user_guide/getting_started.md
      - Pipeline Usage: user_guide/pipeline_usage.md
      - Configuration: user_guide/configuration.md
  - Developer Guide:
      - Architecture: developer_guide/architecture.md
      - Extending the Platform: developer_guide/extending_the_platform.md
      - AI Sessions: developer_guide/ai_sessions.md
  - Reference:
      - Collectors:
          - WSP Improvements: reference/collectors/wsp_improvements.md
      - Schemas:
          - Unified Tables: reference/schemas/unified_tables.md
          - Goose API: reference/schemas/goose_api.md
          - Phish API: reference/schemas/phish_api.md
          - WSP Webscrape: reference/schemas/wsp_webscrape.md
      - Specifications:
          - Database: reference/specifications/database.md
          - Goose Pipeline: reference/specifications/goose_pipeline.md
          - Predictions Schema: reference/specifications/predictions_schema.md
      - Guides:
          - GitHub Actions: reference/guides/github_actions.md
          - Pipeline Optimization: reference/guides/pipeline_optimization.md
          - Supabase API Guide: reference/guides/supabase_api_guide.md
          - Supabase Inserts: reference/guides/supabase_inserts.md
          - Troubleshooting Data Quality: reference/guides/troubleshooting_data_quality.md
  - Archive:
      - Implementation Guide: archive/implementation_guide_v2.md
      - Project Planning:
          - Product Requirements: archive/project/prd.md
          - Architecture Decisions: archive/project/adr.md
          - Implementation Schedule: archive/project/schedule.md
      - Dev Logs: logs/2025-08-29-wsp-parsing-fix.md
